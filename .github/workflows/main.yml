name: Build WhisperShadow

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build
        working-directory: WhisperShadow-4.0-global-update
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WhisperShadow
          path: WhisperShadow-4.0-global-update/build/libs/*.jar
